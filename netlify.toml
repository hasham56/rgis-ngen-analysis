# Netlify serves index.html statically and proxies /api/* to the NGEN backend
# server-side, so the browser only ever talks to its own origin (no CORS).
[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://api-ngen-eu17.rgiseu.com/api/:splat"
  status = 200          # 200 = rewrite/proxy (not a 3xx redirect the browser follows)
  force = true
